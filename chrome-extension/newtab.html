<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- Fullscreen ASCII Creatures Canvas -->
  <canvas id="ascii-canvas"></canvas>

  <!-- Top Bar Controls -->
  <header class="top-bar">
    <div class="top-bar-spacer"></div>
    <div class="theme-dropdown-wrapper">
      <button id="theme-dropdown-btn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="active-dot" id="active-species-dot"></span>
        <span class="active-label" id="active-species-label">Koi</span>
        <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div id="theme-dropdown-menu" class="theme-dropdown-menu hidden" role="menu">
        <div class="menu-header">SELECT SPECIES</div>
        <div id="species-list" class="species-list"></div>
      </div>
    </div>
  </header>

  <!-- Center Hero Content -->
  <main class="center-container" id="ui-container">
    <div class="time-display" id="time-display">12:00</div>
    <div class="date-display" id="date-display">Monday, November 17</div>

    <!-- Search Form -->
    <form class="search-form" id="search-form" action="https://www.google.com/search" method="GET">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          name="q" 
          id="search-input" 
          placeholder="Search Google or enter URL" 
          autocomplete="off" 
          autofocus
        />
      </div>
    </form>

    <!-- Quick Links Bar -->
    <nav class="quick-links" aria-label="Quick Links">
      <a href="https://www.youtube.com" class="link-chip" title="YouTube">
        <span class="chip-icon">▶</span>
        <span>YouTube</span>
      </a>
      <a href="https://github.com" class="link-chip" title="GitHub">
        <span class="chip-icon">⚡</span>
        <span>GitHub</span>
      </a>
      <a href="https://mail.google.com" class="link-chip" title="Gmail">
        <span class="chip-icon">✉</span>
        <span>Gmail</span>
      </a>
      <a href="https://www.reddit.com" class="link-chip" title="Reddit">
        <span class="chip-icon">●</span>
        <span>Reddit</span>
      </a>
      <a href="https://x.com" class="link-chip" title="X / Twitter">
        <span class="chip-icon">𝕏</span>
        <span>Twitter</span>
      </a>
      <a href="https://claude.ai" class="link-chip" title="Claude">
        <span class="chip-icon">✦</span>
        <span>Claude</span>
      </a>
    </nav>

    <footer class="shortcuts-hint">
      <span>Press <b>1-8</b> to switch species</span>
      <span class="dot-sep">•</span>
      <span>Click to startle / feed</span>
      <span class="dot-sep">•</span>
      <span>Press <b>H</b> to hide UI</span>
    </footer>
  </main>

  <script src="engine.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
